name: Agent Backend CI

on:
  push:
    branches: [agent-backend-v0.1]
  pull_request:
    paths:
      - 'agent_backend/**'
      - '.github/workflows/agent-backend-ci.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend and test dependencies
        run: python -m pip install -e 'agent_backend[dev]'
      - name: Run agent backend tests
        run: python -m pytest -q agent_backend/tests

  sql-deployment-preflight:
    runs-on: ubuntu-latest
    needs: test
    strategy:
      fail-fast: false
      matrix:
        pgvector_image:
          - pgvector/pgvector:0.8.5-pg18
          - pgvector/pgvector:0.8.6-pg18
    services:
      postgres:
        image: ${{ matrix.pgvector_image }}
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Run R33 SQL deployment preflight
        run: bash agent_backend/scripts/r33_sql_deployment_preflight.sh

  container-build:
    runs-on: ubuntu-latest
    needs: [test, sql-deployment-preflight]
    steps:
      - uses: actions/checkout@v4
      - name: Build internal-beta container without publishing
        run: docker build --tag vinc-agent-internal-beta:ci agent_backend
