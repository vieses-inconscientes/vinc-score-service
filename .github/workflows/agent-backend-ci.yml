name: Agent Backend CI

on:
  push:
    branches: [agent-backend-v0.1]
  pull_request:
    paths:
      - 'agent_backend/**'
      - '.github/workflows/agent-backend-ci.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test runner
        run: python -m pip install pytest
      - name: Run agent backend tests
        env:
          PYTHONPATH: agent_backend/src
        run: python -m pytest -q agent_backend/tests
