name: Agent Backend CI

on:
  push:
    branches: [agent-backend-v0.1]
  pull_request:
    paths:
      - 'agent_backend/**'
      - '.github/workflows/agent-backend-ci.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend and test dependencies
        run: python -m pip install -e 'agent_backend[dev]'
      - name: Run agent backend tests
        run: python -m pytest -q agent_backend/tests

  container-build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build internal-beta container without publishing
        run: docker build --tag vinc-agent-internal-beta:ci agent_backend
